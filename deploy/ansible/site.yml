# Configures a "lab host": a Debian 12 VM that runs this lab's docker-compose.yml.
# Every VM target uses it, run INSIDE the VM against localhost (Vagrant ansible_local,
# cloud-init on Proxmox/AWS), so nothing Ansible-related runs on the player's machine.
#
# Expects the lab checked out at {{ lab_dir }}. Variables (all optional):
#   ctf_api_url, ctf_launch_token   evidence claim (empty = the lab's dev evidence)
#   attackbox_image                 start an attack box on the lab network
- name: Lab host
  hosts: all
  connection: local
  become: true
  vars:
    lab_dir: /opt/lab
    lab_project: lab
    ctf_api_url: ""
    ctf_launch_token: ""
    attackbox_image: ""
  tasks:
    # Network steps retry: a mirror or registry blip on first boot shouldn't kill the lab.
    - name: Base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, qemu-guest-agent]
        update_cache: true
      register: base_packages
      retries: 5
      delay: 15
      until: base_packages is succeeded

    - name: Guest agent (lets hypervisors report the VM's IP)
      ansible.builtin.service:
        name: qemu-guest-agent
        state: started
        enabled: true
      failed_when: false

    - name: Docker apt key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      register: docker_key
      retries: 5
      delay: 15
      until: docker_key is succeeded

    - name: Docker apt repository
      vars:
        docker_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
        filename: docker

    - name: Docker Engine + Compose
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        update_cache: true
      register: docker_packages
      retries: 5
      delay: 15
      until: docker_packages is succeeded

    - name: Docker running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Evidence claim settings (never baked into the image)
      ansible.builtin.copy:
        dest: "{{ lab_dir }}/.env"
        mode: "0600"
        content: |
          CTF_API_URL={{ ctf_api_url }}
          CTF_LAUNCH_TOKEN={{ ctf_launch_token }}

    # Retried: on a slow host a service's first start (e.g. MySQL initialising) can outlast
    # its healthcheck window; a second `up` succeeds once it is healthy.
    - name: Start the lab
      ansible.builtin.command:
        cmd: docker compose -p {{ lab_project }} up -d --build
        chdir: "{{ lab_dir }}"
      register: lab_up
      retries: 6
      delay: 30
      until: lab_up.rc == 0
      changed_when: true

    - name: Attack box image
      when: attackbox_image | length > 0
      ansible.builtin.command:
        cmd: docker pull {{ attackbox_image }}
      register: attackbox_pull
      retries: 5
      delay: 20
      until: attackbox_pull.rc == 0
      changed_when: "'Downloaded newer image' in attackbox_pull.stdout"

    # Joined to every network of the lab, not just the default one, so labs with their
    # own segments (dmz, internal...) are reachable from the attack box.
    - name: Attack box on the lab networks
      when: attackbox_image | length > 0
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          docker rm -f attacker >/dev/null 2>&1 || true
          mapfile -t networks < <(docker network ls -q --filter label=com.docker.compose.project={{ lab_project }})
          if [ -z "${networks[*]:-}" ]; then
            echo "the lab has no network" >&2
            exit 1
          fi
          docker run -d --name attacker --hostname attacker --network "${networks[0]}" {{ attackbox_image }} sleep infinity
          for network in "${networks[@]:1}"; do
            docker network connect "$network" attacker
          done
      changed_when: true

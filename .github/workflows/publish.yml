name: Register lab

# Registers this lab with CyberCTF (CyberBackend publishLab) at the pushed commit, from
# .ctf/metadata.json. A new lab lands as DRAFT; an existing lab keeps its state.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Register the lab with CyberCTF
        # The template itself has no lab to register.
        if: hashFiles('.ctf/metadata.json') != ''
        env:
          CYBERAUTH_CLIENT_ID: ${{ secrets.CYBERAUTH_CLIENT_ID }}
          CYBERAUTH_CLIENT_SECRET: ${{ secrets.CYBERAUTH_CLIENT_SECRET }}
          CYBERAUTH_TOKEN_URL: ${{ vars.CYBERAUTH_TOKEN_URL || 'https://www.cyberauth.co/api/auth/oauth2/token' }}
          CYBERBACKEND_URL: ${{ vars.CYBERBACKEND_URL || 'https://cyberbackend.com' }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$CYBERAUTH_CLIENT_ID" ] || [ -z "$CYBERAUTH_CLIENT_SECRET" ]; then
            echo "CYBERAUTH_CLIENT_ID / CYBERAUTH_CLIENT_SECRET are not set"
            exit 1
          fi

          # Runtime: a Docker edition (compose.yml) runs as containers; without one the lab is VM-only.
          if [ -f .isoloom/docker/compose.yml ]; then RUNTIME=DOCKER; else RUNTIME=VM; fi
          echo "Runtime: $RUNTIME"

          # CPU architectures every pulled image exists for (built services build anywhere). Only
          # the Docker edition is multi-arch here; a VM-only lab takes the default (the cloud and
          # most local VMs are x86-64).
          ARCHS='["x86_64","aarch64"]'
          if [ -f .isoloom/docker/compose.yml ]; then
            for IMAGE in $(yq -r '.services[] | select(has("build") | not) | .image // empty' .isoloom/docker/compose.yml | sort -u); do
              IMAGE_ARCHS=$(docker buildx imagetools inspect --raw "$IMAGE" | jq -c '
                if .manifests then [.manifests[] | select(.platform.os == "linux") | .platform.architecture] else ["amd64"] end
                | map(if . == "amd64" then "x86_64" elif . == "arm64" then "aarch64" else . end) | unique')
              ARCHS=$(jq -cn --argjson a "$ARCHS" --argjson b "$IMAGE_ARCHS" '$a - ($a - $b)')
            done
          fi
          echo "Architectures: $ARCHS"

          # Where the lab can run, derived from the files Isoloom generated (the source of truth),
          # not a hand-kept list: a Vagrantfile means every local hypervisor plus ESXi; a Proxmox
          # module means Proxmox; each cloud-docker or cloud-vm module means that cloud; a Docker
          # edition means Cyber CTF can host it. `.ctf/metadata.json` `providers`, if set, can only
          # narrow this (never advertise a target Isoloom did not produce).
          PROVIDERS='[]'
          add() { PROVIDERS=$(jq -cn --argjson a "$PROVIDERS" --arg p "$1" '$a + [$p] | unique'); }
          if [ -f .isoloom/vagrant/Vagrantfile ]; then
            for p in virtualbox vmware_desktop parallels hyperv libvirt vmware_esxi; do add "$p"; done
          fi
          if [ -d .isoloom/proxmox ] || [ -d .isoloom/docker-vm/proxmox ]; then add proxmox; fi
          for d in .isoloom/cloud-docker/* .isoloom/cloud-vm/*; do
            [ -d "$d" ] && add "$(basename "$d")"
          done
          [ -f .isoloom/docker/compose.yml ] && add hosted
          META_PROVIDERS=$(jq -c '.providers // empty' .ctf/metadata.json)
          if [ -n "$META_PROVIDERS" ] && [ "$META_PROVIDERS" != "null" ]; then
            PROVIDERS=$(jq -cn --argjson d "$PROVIDERS" --argjson m "$META_PROVIDERS" '$d - ($d - $m)')
          fi
          echo "Providers: $PROVIDERS"

          TOKEN=$(curl -fsS -u "$CYBERAUTH_CLIENT_ID:$CYBERAUTH_CLIENT_SECRET" \
            -d grant_type=client_credentials -d scope=labs:publish -d "resource=$CYBERBACKEND_URL" \
            "$CYBERAUTH_TOKEN_URL" | jq -r '.access_token // empty')
          [ -n "$TOKEN" ] || { echo "Could not get a CyberAuth token"; exit 1; }
          echo "::add-mask::$TOKEN"

          PAYLOAD=$(jq -n --slurpfile lab .ctf/metadata.json --arg repository "$REPOSITORY" --arg commit "$COMMIT" \
            --arg runtime "$RUNTIME" --argjson providers "$PROVIDERS" --argjson architectures "$ARCHS" '
            $lab[0] as $l | {
              query: "mutation($input: PublishLabInput!) { publishLab(input: $input) { labId state } }",
              variables: { input: {
                slug: $l.slug, title: $l.title, description: $l.description,
                category: ($l.category | ascii_upcase), difficulty: $l.difficulty,
                evidenceKind: $l.evidence_kind, evidenceParams: ($l.evidence_params | tojson),
                capabilities: ($l.capabilities // []), question: $l.question,
                runtime: $runtime, repository: $repository, commit: $commit,
                providers: $providers, architectures: $architectures
              } }
            }')
          RESPONSE=$(curl -fsS -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" \
            -d "$PAYLOAD" "$CYBERBACKEND_URL/graphql")
          echo "$RESPONSE" | jq .
          echo "$RESPONSE" | jq -e '.errors == null' > /dev/null

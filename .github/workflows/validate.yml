name: Validate lab

# The lab is its isoloom.yml (https://www.isoloom.com): on every PR and push to main, the spec
# must be valid, the generated files under .isoloom/ current, the Docker edition must come up
# and pass its checks, and every generated Vagrant and Terraform output must be well formed.
# The template itself has no isoloom.yml yet (only isoloom.yml.example): every job skips.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The Isoloom version the lab is generated with (a commit of github.com/isoloom/isoloom).
  ISOLOOM_REV: f64005c55f46a9bc3b3f085e7603cb26740a2104

jobs:
  isoloom:
    runs-on: ubuntu-latest
    if: hashFiles('isoloom.yml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/isoloom
          key: isoloom-${{ env.ISOLOOM_REV }}
      - name: Install isoloom
        run: command -v isoloom || cargo install --locked --git https://github.com/isoloom/isoloom --rev "$ISOLOOM_REV" isoloom
      - run: isoloom validate
      - name: Generated files are current (run `isoloom generate` and commit)
        run: isoloom check

  # Runs the lab for real (development evidence): it must come up healthy and pass its checks.
  lab:
    runs-on: ubuntu-latest
    if: hashFiles('isoloom.yml') != ''
    env:
      COMPOSE: docker compose -p lab -f .isoloom/docker/compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Start the lab
        run: $COMPOSE up -d --build --wait --wait-timeout 300
      - name: Checks (from the player's side)
        run: $COMPOSE --profile check run --rm isoloom-check
      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Stop
        if: always()
        run: $COMPOSE down -v

  terraform:
    runs-on: ubuntu-latest
    if: hashFiles('isoloom.yml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - name: validate (Proxmox, every cloud)
        run: |
          for m in .isoloom/docker-vm/proxmox .isoloom/proxmox .isoloom/cloud-docker/*; do
            [ -f "$m/main.tf" ] || continue
            echo "== $m"
            terraform -chdir="$m" init -backend=false -input=false >/dev/null
            terraform -chdir="$m" validate
          done

  vagrant:
    runs-on: ubuntu-latest
    if: hashFiles('isoloom.yml') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Vagrantfiles parse
        run: for f in .isoloom/*/Vagrantfile; do ruby -c "$f"; done
